name: Deploy to Google Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPO || 'observability' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        run: |
          missing=0
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "::error::Set repository variable GCP_PROJECT_ID (Settings → Actions → Variables)."
            missing=1
          fi
          if [ -z "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "::error::Set repository variable GCP_WORKLOAD_IDENTITY_PROVIDER."
            missing=1
          fi
          if [ -z "${{ vars.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Set repository variable GCP_SERVICE_ACCOUNT."
            missing=1
          fi
          if [ -z "${{ vars.STUDIO_API_URL }}" ]; then
            echo "::notice::STUDIO_API_URL is not set; deploy will call gcloud run services describe testdata-studio. Set STUDIO_API_URL to skip that call (recommended)."
          fi
          exit "$missing"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Image prefix
        id: prefix
        run: echo "value=${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Studio API URL
        id: api
        env:
          STUDIO_API_URL: ${{ vars.STUDIO_API_URL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ -n "$STUDIO_API_URL" ]; then
            echo "url=${STUDIO_API_URL%/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -e
          url="$(gcloud run services describe testdata-studio \
            --project="$GCP_PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"
          if [ -z "$url" ]; then
            echo "::error::Could not resolve testdata-studio URL. Set repository variable STUDIO_API_URL to the API Cloud Run URL."
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push testdata-studio-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/testdata-studio-ui:${{ github.sha }}
            ${{ steps.prefix.outputs.value }}/testdata-studio-ui:latest
          cache-from: type=gha,scope=testdata-studio-ui
          cache-to: type=gha,mode=max,scope=testdata-studio-ui

      - name: Deploy testdata-studio-ui to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        id: ui
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: testdata-studio-ui
          image: ${{ steps.prefix.outputs.value }}/testdata-studio-ui:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --port=8080 --allow-unauthenticated --cpu=1 --memory=256Mi --min-instances=0 --max-instances=2
          env_vars: |
            API_PROXY_TARGET=${{ steps.api.outputs.url }}

      - name: Service URL
        run: echo "Studio UI ${{ steps.ui.outputs.url }}"
